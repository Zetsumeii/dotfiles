backend = "glx";
vsync = false;

fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 5;

blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;

blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
];
